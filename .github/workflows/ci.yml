name: CI - Projet DevOps SHIFT

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verification:
    name: Verification Ansible
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Ansible
        run: |
          python3 -m venv /tmp/ansible-ci
          /tmp/ansible-ci/bin/pip install ansible-core
          /tmp/ansible-ci/bin/ansible-galaxy collection install community.docker

      - name: Verifier les playbooks Ansible
        run: |
          /tmp/ansible-ci/bin/ansible-playbook preparation.yaml --syntax-check
          /tmp/ansible-ci/bin/ansible-playbook deploiement.yaml --syntax-check
